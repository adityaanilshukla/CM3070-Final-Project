[project]
name = "rocketrl"
version = "0.1.0"
description = "Comparative study of deep RL (SAC, PPO) vs classical control on a rocket soft-landing task"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium[box2d]>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pygame>=2.5",
    "tensorboard>=2.16",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "rich>=13.0",
    "tqdm>=4.66",
]

[tool.uv]
# Blackwell (RTX 5060 Ti, sm_120) needs a CUDA 12.8+ torch build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rocketrl"]
